[project]
name = "netad-ml"
version = "0.1.0"
description = "Offline training pipeline and inference bundle for network anomaly detection (CICIoT2023-derived data)"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "pyarrow==18.1.0",
  "scikit-learn==1.5.2",
  "joblib==1.4.2",
]

[project.optional-dependencies]
train = ["matplotlib==3.9.2"]
dev = ["pytest==8.3.3"]
# MLOps tooling for the Docker trainer: experiment tracking/registry client + data/model versioning.
# pathspec is pinned because newer releases break dvc 3.58.
mlops = ["mlflow-skinny==2.19.0", "dvc[s3]==3.58.0", "pathspec==0.12.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["netad_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
