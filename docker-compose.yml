# NetAD — local deployment. Start with ./scripts/start.sh
name: netad

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-netad}:${POSTGRES_PASSWORD:-netad}@db:5432/${POSTGRES_DB:-netad}
  ZABBIX_URL: ${ZABBIX_URL:-http://mock-zabbix:8081/api_jsonrpc.php}
  ZABBIX_TOKEN: ${ZABBIX_TOKEN:-mock-zabbix-token}
  MODEL_DIR: /artifacts/models
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

# MLflow client + DVC S3 credentials for the trainer (SeaweedFS stands in for AWS S3)
x-mlops-env: &mlops-env
  # Default: the local MLflow service. Set MLFLOW_TRACKING_URI in .env to use a hosted server (e.g. DagsHub).
  MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
  MLFLOW_TRACKING_USERNAME: ${MLFLOW_TRACKING_USERNAME:-}
  MLFLOW_TRACKING_PASSWORD: ${MLFLOW_TRACKING_PASSWORD:-}
  MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-netad-anomaly-detection}
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-netad}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-netad-s3-secret}
  DVC_NO_ANALYTICS: "1"

services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netad}
      POSTGRES_DB: ${POSTGRES_DB:-netad}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mock-zabbix:
    build: ./mock_zabbix
    environment:
      MOCK_API_TOKEN: ${ZABBIX_TOKEN:-mock-zabbix-token}
      MOCK_REPLAY_POOL: /artifacts/replay/replay_pool.parquet
      MOCK_SCENARIO_FILE: scenarios/${MOCK_SCENARIO:-defense_demo}.yaml
      MOCK_START_OFFSET_SECONDS: ${MOCK_START_OFFSET_SECONDS:-0}
    volumes:
      - ./artifacts/replay:/artifacts/replay:ro
    ports:
      - "127.0.0.1:${MOCK_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: backend/Dockerfile, target: runtime }
    image: netad-backend:local
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
      DEMO_TRUTH_URL: ${DEMO_TRUTH_URL-http://mock-zabbix:8081/_scenario/truth}
      CORS_ORIGINS: '["http://localhost:${WEB_PORT:-8080}","http://localhost:5173"]'
    volumes:
      - ./artifacts/models:/artifacts/models:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  worker:
    image: netad-backend:local
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-env
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-2}
      INCIDENT_DEBOUNCE_K: ${INCIDENT_DEBOUNCE_K:-3}
      INCIDENT_DEBOUNCE_N: ${INCIDENT_DEBOUNCE_N:-5}
      INCIDENT_GAP_SECONDS: ${INCIDENT_GAP_SECONDS:-60}
      INCIDENT_RESOLVE_SECONDS: ${INCIDENT_RESOLVE_SECONDS:-120}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
    volumes:
      - ./artifacts/models:/artifacts/models:ro
    depends_on:
      api: { condition: service_healthy }        # the api container applies migrations first
      mock-zabbix: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # ---- on-demand services (profiles) ------------------------------------------------
  trainer:
    profiles: ["train"]
    build: ./ml
    image: netad-trainer:local
    # run as the host user so files written into the repo are not owned by root
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /srv/project
    environment:
      <<: *mlops-env
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
      PYTHONPATH: /srv/project/ml
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    volumes:
      - ./:/srv/project          # DVC needs the whole repo (git, dvc.yaml, data/, artifacts/)

  # ---- MLOps services (profile "mlops", started by scripts/mlops.sh, train.sh, promote.sh, dvc.sh) ----
  s3:   # SeaweedFS: S3-compatible object store (replaces MinIO, which no longer publishes public images)
    profiles: ["mlops"]
    image: chrislusf/seaweedfs:4.52
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-netad}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-netad-s3-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"admin","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -ip=s3 -ip.bind=0.0.0.0 -volume.max=0 -master.volumeSizeLimitMB=1024
        -s3 -s3.port=8333 -s3.config=/tmp/s3.json -filer.port=8888
    volumes:
      - s3-data:/data
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
      - "127.0.0.1:${S3_CONSOLE_PORT:-8888}:8888"   # filer web UI: browse buckets under /buckets
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9333/cluster/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  s3-init:   # one-shot: create the buckets (idempotent, retries until the S3 API answers)
    profiles: ["mlops"]
    build: ./mlops/mlflow
    image: netad-mlflow:local
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-netad}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-netad-s3-secret}
    command:
      - python
      - -c
      - |
        import time, boto3
        s3 = boto3.client("s3", endpoint_url="http://s3:8333", region_name="us-east-1")
        for attempt in range(60):
            try:
                have = {b["Name"] for b in s3.list_buckets().get("Buckets", [])}
                for name in ("netad-dvc", "mlflow"):
                    if name not in have:
                        s3.create_bucket(Bucket=name)
                print("buckets ready")
                break
            except Exception as e:
                print("waiting for S3:", e)
                time.sleep(2)
        else:
            raise SystemExit("S3 not reachable")
    depends_on:
      s3: { condition: service_healthy }

  mlflow-db:
    profiles: ["mlops"]
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow}
      POSTGRES_DB: mlflow
    volumes:
      - mlflow-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mlflow:
    profiles: ["mlops"]
    build: ./mlops/mlflow
    image: netad-mlflow:local
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql://mlflow:${MLFLOW_DB_PASSWORD:-mlflow}@mlflow-db:5432/mlflow
      - --artifacts-destination=s3://mlflow
      - --serve-artifacts
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://s3:8333
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-netad}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-netad-s3-secret}
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5050}:5000"
    depends_on:
      mlflow-db: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend-tests:
    profiles: ["test"]
    build: { context: ., dockerfile: backend/Dockerfile, target: test }
    working_dir: /srv/project/backend
    volumes:
      - ./:/srv/project:ro
    environment:
      PYTHONPATH: /srv/project/backend:/srv/project/mock_zabbix:/srv/project/backend/tests
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]

volumes:
  pgdata:
  s3-data:      # DVC remote + MLflow artifacts: deleting it loses versioned data/models
  mlflow-pg:    # MLflow runs + registry
